name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build --tag backend-smoke .

      - name: Check backend container startup
        run: |
          trap 'docker logs backend-smoke; docker rm --force backend-smoke' EXIT
          docker run --detach --name backend-smoke \
            --env-file app/backend/.env.example \
            --env BETTER_AUTH_SECRET=backend-smoke-test-secret-at-least-32-characters \
            --env UNSUBSCRIBE_SECRET=backend-smoke-test-unsubscribe-secret \
            --env EMAIL_NOTIFICATION_ENABLED=false \
            backend-smoke
          for attempt in $(seq 1 30); do
            if docker exec backend-smoke node --input-type=module -e '
              const response = await fetch("http://localhost:3001/api/health");
              const body = await response.json();
              if (!response.ok || body.status !== "ok") process.exit(1);
            '; then
              exit 0
            fi
            if [ "$(docker inspect --format "{{.State.Running}}" backend-smoke)" != true ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - run: pnpm prettier --check .

  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - run: pnpm turbo run check-types

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]
      - run: pnpm turbo run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - run: pnpm turbo run test
  sherif-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - run: pnpm dlx sherif@1.5.0 -r unsync-similar-dependencies
